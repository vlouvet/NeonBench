name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: npm ci
        working-directory: web

      - name: ESLint
        run: npm run lint
        working-directory: web

      # Frontend must build first: web/web.go has //go:embed all:dist, so any
      # `go vet` / `go test` / `go build` needs web/dist/ populated.
      - name: Frontend type-check + build
        run: npm run build
        working-directory: web

      - name: go vet
        run: go vet ./...

      - name: Test (Go + vitest)
        run: ./scripts/test.sh

      - name: Cross-compile binary (smoke)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/neonbench ./cmd/neonbench
