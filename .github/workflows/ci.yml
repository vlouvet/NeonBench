name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs on the same ref when a new commit lands. Saves CI
# minutes when a PR sees iterative pushes — only the latest run completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: npm ci
        working-directory: web

      # ESLint is a hard gate: any error / warning fails CI. The Tier 3
      # cleanup that brought the tree to zero diagnostics shipped in the
      # PR that flipped this flag — keep it that way.
      - name: ESLint
        run: npm run lint
        working-directory: web

      # Frontend must build first: web/web.go has //go:embed all:dist, so any
      # `go vet` / `go test` / `go build` needs web/dist/ populated.
      - name: Frontend type-check + build
        run: npm run build
        working-directory: web

      - name: go vet
        run: go vet ./...

      - name: Test (Go + vitest)
        run: ./scripts/test.sh

      - name: Cross-compile binary (smoke)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/neonbench ./cmd/neonbench

  # Separate job (not a matrix on `test`) because branch protection requires
  # the `test` context by name; matrixing would rename it to `test (ubuntu-latest)`
  # and break the required-checks contract.
  #
  # Scope: Windows is the only platform where users are handed a bare .exe, so
  # this job gates the *shipped artifact*, not just "does Go compile". It builds
  # the real frontend — so //go:embed all:dist embeds the actual Vite bundle
  # rather than a stub — then boots the binary to cover what `go test` cannot:
  # %APPDATA% resolution, goose migrations against a Windows SQLite path, and
  # the embedded SPA being served for real. ESLint and vitest stay Linux-only in
  # `test`; they are platform-independent and duplicating them here only burns
  # CI minutes.
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # Replaces the previous stubbed web/dist/index.html. The smoke-run below
      # asserts a hashed /assets/*.js bundle serves, which a stub cannot satisfy.
      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: go vet
        run: go vet ./...

      - name: go test
        shell: bash
        run: go test $(go list ./... | grep -v '/web/node_modules/')

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X 'github.com/vlouvet/neonbench/internal/version.Version=ci-smoke'" \
            -o dist/neonbench.exe ./cmd/neonbench

      # Boot the artifact a Windows user would actually download. No -DataDir,
      # so this exercises real %APPDATA% resolution on an ephemeral runner.
      - name: Smoke-run the binary
        shell: pwsh
        run: ./scripts/windows-smoke.ps1 -Exe dist/neonbench.exe
