name: Release

# Tagged releases: pushing a `v*` tag triggers a cross-platform build and
# publishes the resulting binaries to a GitHub Release. macOS code signing /
# notarization lands in sub-PR 70b (requires Secrets that aren't configured
# yet) — for now darwin builds are unsigned but the rest of the pipeline is
# end-to-end.
on:
  push:
    tags: ['v*']

# softprops/action-gh-release needs write access to the Releases API to
# create the release and attach assets.
permissions:
  contents: write

jobs:
  # Linux + Windows binaries built from a single ubuntu runner. Cross-compile
  # is cheap with CGO_ENABLED=0 (modernc.org/sqlite is pure-Go).
  build-linux-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # The Go binary embeds web/dist/ via //go:embed, so the frontend MUST
      # be built before any go build. Mirrors the local build flow.
      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: Cross-compile linux + windows binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi
            name="neonbench-${goos}-${goarch}${ext}"
            echo "  -> dist/${name}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X 'github.com/vlouvet/neonbench/internal/version.Version=${VERSION}'" \
              -o "dist/${name}" ./cmd/neonbench
            ( cd dist && shasum -a 256 "${name}" > "${name}.sha256" )
          done
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-windows-binaries
          path: dist/

  # macOS binaries built from a macos-latest runner. UNSIGNED in this PR;
  # sub-PR 70b will add `codesign` + `xcrun notarytool` steps here.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: web

      - name: Build darwin binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for arch in arm64 amd64; do
            name="neonbench-darwin-${arch}"
            echo "  -> dist/${name}"
            GOOS=darwin GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X 'github.com/vlouvet/neonbench/internal/version.Version=${VERSION}'" \
              -o "dist/${name}" ./cmd/neonbench
          done
          ls -lh dist/

      # Checksums are deliberately NOT emitted above: codesign REWRITES the
      # binary, so a digest taken before signing describes a file nobody will
      # ever download. The checksum step is the last thing in this job.

      # Signing is optional so that a tag pushed before the secrets exist
      # still produces a usable (unsigned) release rather than a red build.
      # See docs/apple-signing-setup.md.
      - name: Detect signing configuration
        id: signing
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        run: |
          if [ -n "$P12_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=macOS binaries are unsigned::MACOS_CERT_P12_BASE64 is not set, so this release ships unsigned darwin binaries. Gatekeeper will warn on first launch. See docs/apple-signing-setup.md."
          fi

      - name: Import codesigning certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # A dedicated keychain, not the login one: the runner is ephemeral,
          # but this also keeps the key out of any default-keychain search
          # path a later step might touch.
          KEYCHAIN=build.keychain
          echo "$P12_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$P12_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$P12_PASS" "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$P12_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a GUI keychain prompt that no
          # one is there to answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$P12_PASS" "$KEYCHAIN" > /dev/null
          rm -f /tmp/cert.p12

      - name: Sign darwin binaries
        if: steps.signing.outputs.enabled == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            name="neonbench-darwin-${arch}"
            codesign --force --options runtime --timestamp \
              --entitlements build/macos/entitlements.plist \
              --sign "$IDENTITY" "dist/${name}"
            # --deep is meaningless on a single Mach-O and is deprecated;
            # --strict with a verbose verify is the real check.
            codesign --verify --strict --verbose=2 "dist/${name}"
          done

      - name: Notarize darwin binaries
        if: steps.signing.outputs.enabled == 'true'
        env:
          API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEYFILE="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_KEY_P8" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          for arch in arm64 amd64; do
            name="neonbench-darwin-${arch}"
            # notarytool only accepts a container, so submit a zip of the
            # binary. The binary itself is NOT modified by notarization.
            ditto -c -k "dist/${name}" "$RUNNER_TEMP/${name}.zip"
            xcrun notarytool submit "$RUNNER_TEMP/${name}.zip" \
              --key "$KEYFILE" \
              --key-id "$API_KEY_ID" \
              --issuer "$API_ISSUER_ID" \
              --wait --timeout 30m
          done
          rm -f "$KEYFILE"

          # NO `xcrun stapler staple` HERE, AND THAT IS DELIBERATE.
          #
          # stapler supports exactly three container formats -- run
          # `xcrun stapler --help`: "UDIF disk images, code-signed executable
          # bundles, and signed flat installer packages". A bare Mach-O
          # executable, which is what NeonBench ships, is none of them. An
          # earlier draft of this workflow called stapler here and would have
          # failed the release on every tag push.
          #
          # Without a stapled ticket, Gatekeeper verifies notarization ONLINE
          # on first launch. That is fine for the only case it applies to:
          # a browser download (which is what sets com.apple.quarantine) by
          # someone who, having just downloaded the file, has a network. It
          # does not apply to the self-updater at all -- programmatic
          # downloads do not set the quarantine attribute.
          #
          # If offline first-launch ever needs to work, the fix is to ship a
          # stapled .dmg alongside, NOT to add a stapler call to this loop.

      # Last step in the job, after any signing: see the note above.
      - name: Compute checksums
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            name="neonbench-darwin-${arch}"
            ( cd dist && shasum -a 256 "${name}" > "${name}.sha256" )
          done
          cat dist/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: dist/

  # Combine artifacts into a single GitHub Release. download-artifact@v4
  # places each upload into its own subdirectory (dist/linux-windows-binaries/,
  # dist/macos-binaries/), so we flatten before publishing.
  release:
    needs: [build-linux-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -type f \( -name 'neonbench-*' -o -name '*.sha256' \) -exec cp {} release/ \;
          ls -lh release/

      # One file to sign beats five. The maintainer detached-signs SHA256SUMS
      # with the YubiKey after the release publishes (CI can't reach the key —
      # see specs/active/tier1-yubikey-provenance-unsigned-disclaimer.md), so
      # per-file .sha256 alone would mean five signatures or an unsigned gap.
      #
      # The per-file .sha256 files stay: they're the friendlier check for a
      # non-developer verifying one download, and the README points at them.
      #
      # `sha256sum -c` here is a real gate, not decoration — it proves the
      # binaries that survived the artifact upload/download round-trip still
      # match the hashes computed in the build jobs, before either is published.
      - name: Build and verify SHA256SUMS
        working-directory: release
        run: |
          cat neonbench-*.sha256 | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      # SHA256SUMS needs its own entry: it does not match `neonbench-*`, so
      # listing only that glob would silently publish a release without it.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/neonbench-*
            release/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
